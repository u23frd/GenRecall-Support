<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미리보기 — Existential Labs</title>
<meta name="description" content="GenRecall 실제 앱 화면 미리보기 — 언어를 고르면 그 언어로 된 화면을 볼 수 있습니다.">
<link rel="canonical" href="https://existential-labs.com/app.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root{
    --ink:#16141A; --paper:#F0EFF2; --card:#FFFFFF;
    --violet:#5B3FA0; --violet-soft:#EDE7F8;
    --muted:#635E6E; --rule:#D8D5DE;
    --sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:17px;line-height:1.75;
    letter-spacing:-0.01em;word-break:keep-all;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 24px}
  a{color:var(--violet);text-decoration:none;border-bottom:1px solid var(--violet-soft)}
  a:hover{border-bottom-color:var(--violet)}
  a:focus-visible{outline:2px solid var(--violet);outline-offset:3px;border-radius:2px}

  .label{
    font-family:var(--mono);font-size:11px;font-weight:500;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;
  }

  header{border-bottom:1px solid var(--rule)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 0}
  .brand{font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:0.06em;color:var(--ink);border:0}
  .brand span{color:var(--violet)}
  .nav-side{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  nav{display:flex;gap:20px;font-size:14px}
  nav a{color:var(--muted);border:0}
  nav a:hover{color:var(--violet)}
  nav a.on{color:var(--violet);font-weight:600}
  .site-lang{
    font-family:var(--mono);font-size:13px;color:var(--muted);
    border:1px solid var(--rule);border-radius:8px;background:var(--card);
    padding:6px 8px;cursor:pointer;
  }

  .intro{padding:52px 0 8px}
  .intro h1{font-size:clamp(24px,4.6vw,32px);line-height:1.35;font-weight:700;letter-spacing:-0.03em;margin:0 0 12px}
  .intro h1 em{font-style:normal;color:var(--violet)}
  .intro p{color:var(--muted);margin:0;max-width:60ch}
  .intro h1[dir="rtl"],.intro p[dir="rtl"]{text-align:right}

  .controls{padding:26px 0 6px}
  .ctl-label{
    font-family:var(--mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--muted);margin:18px 0 8px;
  }
  .ctl-label:first-child{margin-top:0}
  .ctl-label[dir="rtl"]{text-align:right}

  .seg{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    appearance:none;border:1px solid var(--rule);background:var(--card);color:var(--ink);
    font-family:var(--sans);font-size:14.5px;line-height:1;letter-spacing:-0.01em;
    padding:10px 16px;border-radius:999px;cursor:pointer;transition:border-color .15s,background .15s,color .15s;
  }
  .chip:hover{border-color:var(--violet)}
  .chip.on{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:600}
  .chip.off{color:var(--muted);background:transparent;opacity:.5;cursor:default}
  .chip.off:hover{border-color:var(--rule)}

  .now{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin:26px 0 4px;padding:14px 18px;
    background:var(--violet-soft);border-radius:12px;font-size:14.5px;color:var(--ink);
  }
  .now b{color:var(--violet)}
  .now .cnt{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .coming-note{font-size:13px;color:var(--muted);margin:8px 2px 0}
  .coming-note[dir="rtl"]{text-align:right}

  .rows{padding:10px 0 72px}
  .row{padding:34px 0 6px}
  .row + .row{border-top:1px solid var(--rule)}
  .row-head{margin:0 0 14px}
  .row-head[dir="rtl"]{text-align:right}
  .row-title{display:flex;align-items:baseline;gap:12px;margin:0 0 6px}
  .row-head[dir="rtl"] .row-title{flex-direction:row-reverse}
  .row-num{font-family:var(--mono);font-size:12px;color:var(--violet);letter-spacing:0.08em;white-space:nowrap}
  .row-name{font-size:19px;font-weight:700;letter-spacing:-0.02em;margin:0}
  .row-desc{
    font-size:15px;color:var(--muted);margin:0;max-width:60ch;
    min-height:3.2em;
    transition:opacity .18s ease;
  }
  .row-head[dir="rtl"] .row-desc{margin-left:auto}
  .row-desc .idx{font-family:var(--mono);font-size:11.5px;color:var(--violet);margin-right:8px}
  .row-head[dir="rtl"] .row-desc .idx{margin-right:0;margin-left:8px}

  .empty{
    margin:34px 0 60px;padding:40px 26px;text-align:center;
    background:var(--card);border:1px dashed var(--rule);border-radius:14px;
    color:var(--muted);font-size:15px;
  }

  .car-box{position:relative}
  .car{
    display:flex;gap:14px;overflow-x:auto;
    scroll-snap-type:x mandatory;
    padding:4px 2px 10px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .car::-webkit-scrollbar{display:none}
  .slide{flex:0 0 auto;scroll-snap-align:start;cursor:zoom-in}
  .slide:active{cursor:grabbing}
  .car[data-device="phone"] .slide{width:min(250px,64vw)}
  .car[data-device="tablet"] .slide{width:min(560px,84vw)}
  .slide img{
    width:100%;display:block;border-radius:20px;
    border:1px solid var(--rule);
    box-shadow:0 8px 26px rgba(22,20,26,.10);
    background:#17151C;
  }
  .car[data-device="tablet"] .slide img{border-radius:14px}

  .nav-btn{
    position:absolute;top:50%;transform:translateY(-50%);z-index:2;
    width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);
    background:rgba(255,255,255,.94);color:var(--ink);
    font-size:19px;line-height:1;cursor:pointer;display:none;
    align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(22,20,26,.12);
    transition:opacity .15s,border-color .15s;
  }
  .nav-btn:hover{border-color:var(--violet);color:var(--violet)}
  .nav-btn.prev{left:-14px}
  .nav-btn.next{right:-14px}
  .nav-btn[data-off="1"]{opacity:0;pointer-events:none}
  @media (hover:hover) and (pointer:fine){ .nav-btn{display:flex} }

  .dots{display:flex;gap:7px;justify-content:center;padding:6px 0 2px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);transition:background .2s,transform .2s}
  .dots i.on{background:var(--violet);transform:scale(1.25)}
  .dots[data-single="1"]{visibility:hidden}

  /* 라이트박스 */
  .lb{
    position:fixed;inset:0;z-index:50;display:none;
    align-items:center;justify-content:center;
    background:rgba(22,20,26,.82);backdrop-filter:blur(6px);
    padding:28px;
  }
  .lb.open{display:flex}
  .lb img{
    max-width:min(92vw,1400px);max-height:84vh;width:auto;height:auto;display:block;
    border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.5);background:#17151C;
  }
  .lb-cap{
    position:fixed;left:0;right:0;bottom:16px;text-align:center;color:#fff;
    font-size:14.5px;line-height:1.5;text-shadow:0 1px 8px rgba(0,0,0,.7);
    padding:0 76px;margin:0;
  }
  .lb-btn{
    position:fixed;z-index:51;width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(255,255,255,.14);color:#fff;font-size:22px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .lb-btn:hover{background:rgba(255,255,255,.30)}
  .lb-close{top:18px;right:18px}
  .lb-prev{left:14px;top:50%;transform:translateY(-50%)}
  .lb-next{right:14px;top:50%;transform:translateY(-50%)}
  .lb-count{position:fixed;top:28px;left:24px;color:#fff;font-family:var(--mono);font-size:13px;opacity:.85}
  body.lb-lock{overflow:hidden}

  footer{border-top:1px solid var(--rule);padding:34px 0 54px}
  footer .copy{font-size:13px;color:var(--muted)}

  @media (max-width:520px){
    body{font-size:16px}
    .intro{padding:40px 0 4px}
    .nav-btn.prev{left:-6px}
    .nav-btn.next{right:-6px}
    .row-desc{min-height:3.4em}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important;scroll-behavior:auto!important} }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" id="brand-link" href="/">EXISTENTIAL<span>·</span>LABS</a>
    <div class="nav-side">
      <nav id="site-nav"></nav>
      <select class="site-lang" id="site-lang" aria-label="Site language">
        <option value="ko">한국어</option>
        <option value="en">English</option>
      </select>
    </div>
  </div>
</header>

<main>
  <div class="wrap intro">
    <p class="label">Screenshots</p>
    <h1 id="intro-title"></h1>
    <p id="intro-sub"></p>
  </div>

  <div class="wrap controls">
    <p class="ctl-label" id="lbl-mylang"></p>
    <div class="seg" id="lang-seg"></div>

    <p class="ctl-label" id="lbl-learnlang"></p>
    <div class="seg" id="tgt-seg"></div>
    <p class="coming-note" id="coming-note"></p>

    <p class="ctl-label" id="lbl-device"></p>
    <div class="seg" id="dev-seg"></div>

    <div class="now" id="now-line" hidden></div>
  </div>

  <div class="wrap rows" id="rows"></div>
</main>

<footer>
  <div class="wrap">
    <p class="copy">© 2026 Existential Labs. All rights reserved.</p>
  </div>
</footer>

<!-- 라이트박스: 스샷 클릭 → 팝업 확대 (이 시점에만 원본 화질 로드) -->
<div class="lb" id="lb" role="dialog" aria-modal="true">
  <span class="lb-count" id="lb-count"></span>
  <button class="lb-btn lb-close" aria-label="Close">×</button>
  <button class="lb-btn lb-prev" aria-label="Previous">‹</button>
  <img id="lb-img" alt="">
  <button class="lb-btn lb-next" aria-label="Next">›</button>
  <p class="lb-cap" id="lb-cap"></p>
</div>

/* ═════════ manifest + 상태 ═════════ */
const params = new URLSearchParams(location.search);
const DEMO = params.get('demo') === '1';

const MF = (window.SHOTS_MANIFEST && window.SHOTS_MANIFEST.pairs)
  ? window.SHOTS_MANIFEST
  : {version: 1, pairs: {}};
if (DEMO){
  // ?demo=1 — 실기기에서 스와이프 감을 확인하기 위한 자리표시자 모드 (전 조합 가짜 목록)
  MF.pairs = {};
  for (const l of LANGS){
    for (const t of l.targets){
      const counts = {};
      for (const r of ROWS) counts[r.id] = r.caps.length;
      MF.pairs[`${l.code}-${t}`] = {phone: {...counts}, tablet: {...counts}};
    }
  }
}

const manifestEmpty = Object.keys(MF.pairs).length === 0;
const pairHas = (pair, device) => {
  const p = MF.pairs[pair];
  if (!p || !p[device]) return false;
  return Object.values(p[device]).some(n => n > 0);
};
const pairAny = (pair) => pairHas(pair, 'phone') || pairHas(pair, 'tablet');
const langAny = (code) => {
  const l = LANGS.find(x => x.code === code);
  return l.targets.some(t => pairAny(`${code}-${t}`));
};

const state = {lang: 'ko', target: 'en', device: 'phone'};

// URL 파라미터로 초기 상태 지정 (?lang=vi&target=ko&device=tablet)
{
  const pl = params.get('lang');
  if (pl && LANGS.some(l => l.code === pl)) state.lang = pl;
  const cur = LANGS.find(l => l.code === state.lang);
  state.target = cur.targets[0];
  const pt = params.get('target');
  if (pt && cur.targets.includes(pt)) state.target = pt;
  const pd = params.get('device');
  if (pd === 'tablet' || pd === 'phone') state.device = pd;
}

/* ═════════ 유틸 ═════════ */
const $ = (id) => document.getElementById(id);
function pick(dict){
  if (dict[state.lang]) return {text: dict[state.lang], lang: state.lang};
  return {text: dict.en, lang: 'en'};
}
function currentLang(){ return LANGS.find(l => l.code === state.lang); }
function pairKey(){ return `${state.lang}-${state.target}`; }
function pairLabel(){ return `${currentLang().name} → ${TARGET_NAME[state.target]}`; }
function isRtl(){ return RTL.has(state.lang); }

function thumbSrc(rowId, i){ return `shots/${pairKey()}/${state.device}/${rowId}-${i}.webp`; }
function fullSrc(rowId, i){ return `shots/${pairKey()}/${state.device}/full/${rowId}-${i}.webp`; }

/* ?demo=1 자리표시자 이미지 (실기기 스와이프 확인용) */
function phSvg(rowTitle, idx, total, extra){
  const phone = state.device === 'phone';
  const w = phone ? 1080 : 1600, h = phone ? 2340 : 1000;
  const svg =
`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
<rect width="${w}" height="${h}" fill="#17151C"/>
<rect x="0" y="0" width="${w}" height="${phone?190:120}" fill="#1F1B27"/>
<rect x="${w*0.06}" y="${phone?70:38}" width="${w*0.34}" height="${phone?52:40}" rx="12" fill="#5B3FA0" opacity="0.85"/>
<text x="50%" y="46%" text-anchor="middle" fill="#EDE7F8" font-family="sans-serif" font-size="${phone?92:72}" font-weight="700">${rowTitle}</text>
<text x="50%" y="54%" text-anchor="middle" fill="#8B8696" font-family="sans-serif" font-size="${phone?58:46}">${idx} / ${total}</text>
<text x="50%" y="92%" text-anchor="middle" fill="#5F5A6B" font-family="monospace" font-size="${phone?44:34}">${extra}</text>
<rect x="1.5" y="1.5" width="${w-3}" height="${h-3}" rx="${phone?56:28}" fill="none" stroke="#332E40" stroke-width="3"/>
</svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ═════════ 사이트 헤더 (탭·언어 드롭다운) ═════════
   갤러리에서 고른 언어가 ko면 한국어 사이트, 그 외엔 영어 사이트 기준으로 안내 */
const NAV = {
  ko: [
    {href:'/#app',          label:'앱'},
    {href:'/app.html',      label:'미리보기', on:true},
    {href:'/support.html',  label:'문의'},
    {href:'/terms.html',    label:'이용약관'},
    {href:'/privacy.html',  label:'개인정보'},
  ],
  en: [
    {href:'/en/#app',           label:'App'},
    {href:'/app.html?lang=en',  label:'Preview', on:true},
    {href:'/en/support.html',   label:'Contact'},
    {href:'/en/terms.html',     label:'Terms'},
    {href:'/en/privacy.html',   label:'Privacy'},

function renderHeader(){
  const mode = state.lang === 'ko' ? 'ko' : 'en';
  $('brand-link').href = mode === 'ko' ? '/' : '/en/';

    const a = document.createElement('a');
    a.href = item.href;
    a.textContent = item.label;
    if (item.on) a.className = 'on';
    nav.append(a);
  }
  $('site-lang').value = mode;
}
$('site-lang').addEventListener('change', (e) => {
  state.lang = e.target.value; // ko 또는 en
  state.target = currentLang().targets[0];
  renderAll();
});

/* ═════════ 컨트롤 ═════════ */
function chip(label, on, onClick){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'chip' + (on ? ' on' : '');
  b.textContent = label;
  b.addEventListener('click', onClick);
  return b;
}

function renderUI(){
  const rtl = isRtl();
  const set = (id, dict, asHtml) => {
    const el = $(id);
    const c = pick(dict);
    if (asHtml) el.innerHTML = c.text; else el.textContent = c.text;
    el.lang = c.lang;
    el.dir = rtl ? 'rtl' : 'ltr';
  };
  set('intro-title', UI.introTitle, true);
  set('intro-sub', UI.introSub);
  set('lbl-mylang', UI.myLang);
  set('lbl-learnlang', UI.learnLang);
  set('lbl-device', UI.device);
  set('coming-note', UI.coming);
  document.documentElement.lang = state.lang;
}

function renderControls(){
  // 내 언어 — 스크린샷이 있는 언어만 노출 (아직 아무것도 없으면 전부 노출)
  const seg = $('lang-seg'); seg.replaceChildren();
  for (const l of LANGS){
    if (!manifestEmpty && !langAny(l.code) && l.code !== state.lang) continue;
    seg.append(chip(l.name, state.lang === l.code, () => {
      state.lang = l.code;
      const cur = currentLang();
      if (!cur.targets.includes(state.target)) state.target = cur.targets[0];
      renderAll();
    }));
  }

  // 학습 언어 — 전 언어 노출, en·ko(자기 모국어 제외)만 활성, 나머지 회색
  const tgt = $('tgt-seg'); tgt.replaceChildren();
  const available = currentLang().targets;
  for (const l of LANGS){
    const enabled = available.includes(l.code) && (manifestEmpty || pairAny(`${state.lang}-${l.code}`) || l.code === state.target);
    const b = chip(l.name, state.target === l.code, () => {
      if (!enabled) return;
      state.target = l.code;
      renderAll();
    });
    if (!enabled) b.classList.add('off');
    tgt.append(b);
  }

  // 기기 — 그 쌍에 스크린샷 없는 기기는 회색
  const dev = $('dev-seg'); dev.replaceChildren();
  for (const d of ['phone', 'tablet']){
    const enabled = manifestEmpty || pairHas(pairKey(), d) || d === state.device;
    const b = chip(pick(d === 'phone' ? UI.phone : UI.tablet).text, state.device === d, () => {
      if (!enabled) return;
      state.device = d;
      renderAll();
    });
    if (!enabled) b.classList.add('off');
    dev.append(b);
  }
}

/* ═════════ 갤러리 ═════════ */
function renderRows(){
  const rows = $('rows'); rows.replaceChildren();
  const pk = pairKey();
  const counts = (MF.pairs[pk] && MF.pairs[pk][state.device]) ? MF.pairs[pk][state.device] : {};
  const visible = ROWS.filter(r => (counts[r.id] || 0) > 0);
  const total = visible.reduce((s, r) => s + counts[r.id], 0);
  const rtl = isRtl();

  const nowLine = $('now-line');
  if (visible.length === 0){
    nowLine.hidden = true;
    const box = document.createElement('div');
    box.className = 'empty';
    const c = pick(UI.preparing);
    box.textContent = c.text;
    box.lang = c.lang;
    box.dir = rtl ? 'rtl' : 'ltr';
    rows.append(box);
    return;
  }
  nowLine.hidden = false;
  nowLine.innerHTML = `${pick(UI.nowViewing).text}: <b>${pairLabel()}</b> · <b>${pick(state.device === 'phone' ? UI.phone : UI.tablet).text}</b><span class="cnt">${visible.length} × ${total}</span>`;

  visible.forEach((row, ri) => {
    const n = counts[row.id];
    const title = pick(row.title);

    const sec = document.createElement('section');
    sec.className = 'row';

    const head = document.createElement('div');
    head.className = 'row-head';
    head.dir = rtl ? 'rtl' : 'ltr';

    const titleLine = document.createElement('div');
    titleLine.className = 'row-title';
    const num = document.createElement('span');
    num.className = 'row-num';
    num.textContent = String(ri + 1).padStart(2, '0');
    const name = document.createElement('h2');
    name.className = 'row-name';
    name.textContent = title.text;
    name.lang = title.lang;
    titleLine.append(num, name);

    const desc = document.createElement('p');
    desc.className = 'row-desc';
    head.append(titleLine, desc);

    const box = document.createElement('div');
    box.className = 'car-box';
    const car = document.createElement('div');
    car.className = 'car';
    car.dataset.device = state.device;
    for (let i = 1; i <= n; i++){
      const slide = document.createElement('div');
      slide.className = 'slide';
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = `${title.text} ${i}/${n}`;
      img.src = DEMO ? phSvg(row.title.ko, i, n, `${pairLabel()} · ${state.device}`) : thumbSrc(row.id, i);
      slide.append(img);
      car.append(slide);
    }

    const prev = document.createElement('button');
    prev.type = 'button';
    prev.className = 'nav-btn prev'; prev.textContent = '‹'; prev.setAttribute('aria-label', 'Previous');
    const next = document.createElement('button');
    next.type = 'button';
    next.className = 'nav-btn next'; next.setAttribute('aria-label', 'Next'); next.textContent = '›';

    const dots = document.createElement('div');
    dots.className = 'dots';
    dots.dataset.single = n <= 1 ? '1' : '0';
    for (let i = 0; i < n; i++){ dots.append(document.createElement('i')); }

    box.append(prev, car, next);
    sec.append(head, box, dots);
    rows.append(sec);

    wireCarousel(car, prev, next, dots, desc, row, n);
  });
}

/* 슬라이드 i의 설명: 촬영 장수가 설명 초안보다 많으면 마지막 설명을 유지 */
function capOf(row, idx){
  const caps = row.caps;
  return pick(caps[Math.min(idx, caps.length - 1)]);
}

function setDesc(desc, row, idx, n){
  const c = capOf(row, idx);
  desc.replaceChildren();
  if (n > 1){
    const tag = document.createElement('span');
    tag.className = 'idx';
    tag.textContent = `${idx + 1}/${n}`;
    desc.append(tag);
  }
  desc.append(document.createTextNode(c.text));
  desc.lang = c.lang;
}

function wireCarousel(car, prev, next, dots, desc, row, n){
  const step = () => {
    const s = car.querySelector('.slide');
    return s ? s.getBoundingClientRect().width + 14 : 260;
  };

  // 스샷 클릭 → 팝업 확대 (마우스 드래그로 넘긴 직후의 클릭은 무시)
  let suppressClick = false;
  [...car.querySelectorAll('.slide')].forEach((slide, i) => {
    slide.addEventListener('click', () => {
      if (suppressClick){ suppressClick = false; return; }
      lbShow(row, i, n);
    });
  });

  prev.addEventListener('click', () => car.scrollBy({left: -step(), behavior: 'smooth'}));
  next.addEventListener('click', () => car.scrollBy({left: step(), behavior: 'smooth'}));

  let raf = 0, lastIdx = -1, fadeTimer = 0;
  const update = () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const idx = Math.min(n - 1, Math.max(0, Math.round(car.scrollLeft / step())));
      dots.querySelectorAll('i').forEach((d, i) => d.classList.toggle('on', i === idx));
      const max = car.scrollWidth - car.clientWidth - 4;
      prev.dataset.off = car.scrollLeft <= 4 ? '1' : '0';
      next.dataset.off = car.scrollLeft >= max ? '1' : '0';

      if (idx !== lastIdx){
        if (lastIdx === -1){
          setDesc(desc, row, idx, n);
        } else {
          clearTimeout(fadeTimer);
          desc.style.opacity = '0';
          fadeTimer = setTimeout(() => {
            setDesc(desc, row, idx, n);
            desc.style.opacity = '1';
          }, 160);
        }
        lastIdx = idx;
      }
    });
  };
  car.addEventListener('scroll', update, {passive: true});
  update();

  // 데스크톱 마우스 드래그로도 넘기기
  let down = false, sx = 0, sl = 0, moved = false;
  car.addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'mouse') return;
    down = true; moved = false; sx = e.clientX; sl = car.scrollLeft;
    car.style.scrollSnapType = 'none';
  });
  window.addEventListener('pointermove', (e) => {
    if (!down) return;
    const dx = e.clientX - sx;
    if (Math.abs(dx) > 3) moved = true;
    car.scrollLeft = sl - dx;
  });
  window.addEventListener('pointerup', () => {
    if (!down) return;
    down = false;
    car.style.scrollSnapType = '';
    if (moved){
      suppressClick = true;
      const idx = Math.round(car.scrollLeft / step());
      car.scrollTo({left: idx * step(), behavior: 'smooth'});
    }
  });
}

/* ═════════ 라이트박스 ═════════ */
const lb = {row: null, idx: 0, n: 0, open: false};
const lbEl = $('lb'), lbImg = $('lb-img'), lbCap = $('lb-cap'), lbCount = $('lb-count');

function lbShow(row, idx, n){
  lb.row = row; lb.idx = idx; lb.n = n; lb.open = true;
  const title = pick(row.title);
  if (DEMO){
    lbImg.src = phSvg(row.title.ko, idx + 1, n, `${pairLabel()} · full`);
  } else {
    // 원본 화질은 이 시점에만 로드. full 파일이 없으면 축소본으로 대체.
    lbImg.onerror = () => { lbImg.onerror = null; lbImg.src = thumbSrc(row.id, idx + 1); };
    lbImg.src = fullSrc(row.id, idx + 1);
  }
  lbImg.alt = `${title.text} ${idx + 1}/${n}`;
  const c = capOf(row, idx);
  lbCap.textContent = c.text; lbCap.lang = c.lang; lbCap.dir = RTL.has(c.lang) ? 'rtl' : 'ltr';
  lbCount.textContent = `${idx + 1} / ${n}`;
  lbEl.classList.add('open');
  document.body.classList.add('lb-lock');
}
function lbClose(){
  lb.open = false;
  lbEl.classList.remove('open');
  document.body.classList.remove('lb-lock');
  lbImg.onerror = null;
  lbImg.removeAttribute('src');
}
function lbNav(d){
  if (!lb.open) return;
  lbShow(lb.row, (lb.idx + d + lb.n) % lb.n, lb.n);
}
lbEl.addEventListener('click', (e) => { if (e.target === lbEl) lbClose(); });
document.querySelector('.lb-close').addEventListener('click', lbClose);
document.querySelector('.lb-prev').addEventListener('click', () => lbNav(-1));
document.querySelector('.lb-next').addEventListener('click', () => lbNav(1));
window.addEventListener('keydown', (e) => {
  if (!lb.open) return;
  if (e.key === 'Escape') lbClose();
  else if (e.key === 'ArrowLeft') lbNav(-1);
  else if (e.key === 'ArrowRight') lbNav(1);
});
let lbTouchX = null;
lbEl.addEventListener('touchstart', (e) => { lbTouchX = e.touches[0].clientX; }, {passive: true});
lbEl.addEventListener('touchend', (e) => {
  if (lbTouchX === null) return;
  const dx = e.changedTouches[0].clientX - lbTouchX;
  lbTouchX = null;
  if (Math.abs(dx) > 45) lbNav(dx < 0 ? 1 : -1);
}, {passive: true});

/* ═════════ 렌더 ═════════ */
function renderAll(){ renderHeader(); renderUI(); renderControls(); renderRows(); }
renderAll();
</script>
